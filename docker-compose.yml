services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DATABASE_DRIVER=postgres
      - DATABASE_URL=postgres://homeadmin:homeadmin@db:5432/homeadmin?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: homeadmin
      POSTGRES_USER: homeadmin
      POSTGRES_PASSWORD: homeadmin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeadmin"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
